; KTOS - Arduino Uno EEPROM example (bare-metal, no Arduino framework)
;
; Two KTOS tasks demonstrate the ATmega328P's 1 KB of internal EEPROM:
;   counter_task -> boot counter that survives resets + 5 s heartbeat +
;                   READ / WRITE / DUMP / INFO / HELP shell.
;   rx_task      -> drains USART0 and posts MSG_LINE_READY to counter_task.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
