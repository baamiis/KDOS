; KTOS - Arduino Uno USB-serial CLI example (bare-metal, no Arduino framework)
;
; Two KTOS tasks form an interactive shell over the Uno's USB CDC link.
;   rx_task  -> drains USART0, assembles a line, posts MSG_LINE_READY.
;   cmd_task -> parses HELP / INFO / LED ON/OFF/TOGGLE / ADC / BTN / ECHO.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
