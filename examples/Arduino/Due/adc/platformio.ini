; KTOS - Arduino Due ADC example
;
; PlatformIO's atmelsam platform does not expose a "no framework" mode
; for the Due, so we use framework = arduino purely for the boot
; scaffolding (vector table, reset handler, PLL clock setup at 84 MHz,
; linker script).  We do NOT call any Arduino API - peripheral access
; goes directly through SAM3X8E registers.  setup() calls ktos_RunOS()
; which never returns; Arduino's loop() is never reached.

[env:due]
platform      = atmelsam
board         = due
framework     = arduino
monitor_speed = 115200

; KTOS scheduler + SAM3X8E BSP (ktos_multi.c is excluded - Arduino
; provides main(); we provide setup()).
build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/sam3x8e/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/sam3x8e
