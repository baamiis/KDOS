; KTOS — Arduino Due led_control example (bare-metal, no Arduino framework)
;
; Serial output: connect via the PROGRAMMING port (small USB near reset).
; The programming port's ATmega16U2 bridges to UART0 (D0/RX, D1/TX).

[env:due]
platform             = atmelsam
board                = due
upload_protocol      = sam-ba
monitor_speed        = 115200
board_build.ldscript = ../../../../bsp/sam3x8e/sam3x8e.ld

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/sam3x8e/ktos_bsp.c>
    +<../../../../../bsp/sam3x8e/startup.c>

build_flags =
    -mcpu=cortex-m3 -mthumb
    -DF_CPU=84000000UL
    -Wall -Wextra -Os
    -ffunction-sections -fdata-sections
    -Wl,--gc-sections
    --specs=nosys.specs
    -I../../../../core
    -I../../../../bsp/sam3x8e
