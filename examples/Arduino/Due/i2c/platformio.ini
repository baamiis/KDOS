; KTOS - Arduino Due i2c example
;
; Uses framework = arduino purely for boot scaffolding (vector table,
; PLL clock setup to 84 MHz, linker script).  Application code goes
; directly to SAM3X8E registers - no Arduino API calls.

[env:due]
platform      = atmelsam
board         = due
framework     = arduino
monitor_speed = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/sam3x8e/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/sam3x8e
