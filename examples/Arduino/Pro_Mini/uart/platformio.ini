; KTOS — Arduino Nano UART example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   rx_task  -> drains USART0 into a fixed buffer, posts a complete
;               line to cmd_task with MSG_LINE_READY.
;   cmd_task -> parses PING / INFO / HELP and prints the response.

[env:nanoatmega328]
platform        = atmelavr
board           = pro16MHzatmega328
upload_protocol = arduino
board_upload.speed = 57600
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
