; KTOS - Arduino Pro Mini SPI loopback example (bare-metal, no Arduino framework)
;
; A single KTOS task drives the hardware SPI peripheral in master mode
; and performs a loopback self-test every second.  Connect MOSI (D11)
; to MISO (D12) with a jumper wire; the task writes a test pattern and
; verifies the bytes come back unchanged.

[env:pro16MHzatmega328]
platform           = atmelavr
board              = pro16MHzatmega328
upload_protocol    = arduino
board_upload.speed = 57600
monitor_speed      = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
