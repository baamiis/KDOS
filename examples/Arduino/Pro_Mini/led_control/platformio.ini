; KTOS — Arduino Nano LED control example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   uart_task -> reads USART0, parses ON/OFF/BLINK,
;                ktos_SendMsg(led_task, MSG_SET_MODE, mode, 0)
;   led_task  -> drives D13 (PB5), periodic blink or solid on/off

[env:nanoatmega328]
platform        = atmelavr
board           = pro16MHzatmega328
upload_protocol = arduino
board_upload.speed = 57600
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
