; KTOS — Arduino Nano button control example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   button_task -> 5 ms poll, debounces D2 (PD2),
;                  ktos_SendMsg(MSG_BUTTON_EVENT) to ui_task
;   ui_task     -> consumes MSG_BUTTON_EVENT and prints

[env:nanoatmega328]
platform        = atmelavr
board           = nanoatmega328
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
