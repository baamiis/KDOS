; KTOS — Arduino Nano ADC example (bare-metal, no Arduino framework)
;
; A single KTOS task wakes once per second, samples the ADC on channel
; A0 via direct register access, and prints the result over USART0.

[env:nanoatmega328]
platform        = atmelavr
board           = nanoatmega328
upload_protocol = arduino
monitor_speed   = 115200

; KTOS scheduler + AVR BSP (ktos_multi.c is excluded — we provide main()).
build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
