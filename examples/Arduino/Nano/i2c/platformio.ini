; KTOS — Arduino Nano I2C scanner example (bare-metal, no Arduino framework)
;
; A single KTOS task wakes every 5 seconds and walks addresses
; 0x01..0x7E on the TWI (I2C) bus via direct register access.

[env:nanoatmega328]
platform        = atmelavr
board           = nanoatmega328
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
