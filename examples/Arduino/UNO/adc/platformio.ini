; KTOS — Arduino UNO ADC example (bare-metal, no Arduino framework)
;
; Single KTOS task reads A0 (PF0/ADC0) every 1 s and prints raw value
; and millivolts over USART0 at 115200 baud.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
