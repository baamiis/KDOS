; KTOS — Arduino UNO SPI loopback example (bare-metal, no Arduino framework)
;
; Single KTOS task runs an SPI master loopback self-test once per second.
; Connect D11 (MOSI) to D12 (MISO) with a jumper wire.
;
; Note: D13 (PB5) is both the on-board LED and the SCK line on the UNO,
; so the LED will flicker briefly during each SPI transfer.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
