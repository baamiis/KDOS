; KTOS — Arduino UNO I2C scanner example (bare-metal, no Arduino framework)
;
; Single KTOS task scans the I2C bus (0x01..0x7E) every 5 s.
; SDA = A4 (PC4), SCL = A5 (PC5).  TWI at 100 kHz, no Wire library.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
