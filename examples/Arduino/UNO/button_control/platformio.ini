; KTOS — Arduino UNO button control example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   button_task -> polls D2 (PD2) every 5 ms, 30 ms debounce,
;                  posts MSG_BUTTON_EVENT to ui_task on each edge.
;   ui_task     -> sleeps until MSG_BUTTON_EVENT, prints press/release.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
