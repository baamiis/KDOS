; KTOS — Arduino UNO LED control example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   uart_task -> polls USART0 RX every 20 ms, parses ON/OFF/BLINK,
;                posts MSG_SET_MODE to led_task.
;   led_task  -> owns D13 (PB5), switches between OFF / ON / BLINK.

[env:uno]
platform        = atmelavr
board           = uno
upload_protocol = arduino
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega328p/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega328p
