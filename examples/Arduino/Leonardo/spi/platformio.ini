; KTOS — Arduino Leonardo SPI loopback example (bare-metal, no Arduino framework)
;
; Single KTOS task runs an SPI master loopback self-test once per second.
; SPI pins are on the 6-pin ICSP header:
;   MOSI = ICSP-4 (PB2)
;   MISO = ICSP-1 (PB3)
;   SCK  = ICSP-3 (PB1)
;   SS   = PB0
; Connect ICSP-4 (MOSI) to ICSP-1 (MISO) with a jumper wire.
;
; Requires a USB-to-serial adapter on D0(RX)/D1(TX) — see uart example.

[env:leonardo]
platform        = atmelavr
board           = leonardo
upload_protocol = avr109
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega32u4/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega32u4
