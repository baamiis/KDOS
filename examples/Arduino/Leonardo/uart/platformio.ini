; KTOS — Arduino Leonardo UART example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   rx_task  -> drains USART1 into a fixed buffer, posts MSG_LINE_READY
;               to cmd_task when a complete line is received.
;   cmd_task -> parses PING / INFO / HELP and prints the response.
;
; IMPORTANT: The Leonardo has no USB-to-serial chip.  Without the Arduino
; USB CDC stack this example uses USART1 (hardware UART) on D0(RX)/D1(TX).
; Connect a USB-to-serial adapter: adapter-RX -> D1(TX), adapter-TX -> D0(RX).

[env:leonardo]
platform        = atmelavr
board           = leonardo
upload_protocol = avr109
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega32u4/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega32u4
