; KTOS — Arduino Leonardo ADC example (bare-metal, no Arduino framework)
;
; Single KTOS task reads A0 (PF7, ADC channel 7) every 1 s and prints
; raw value and millivolts over USART1.
;
; Note: on the ATmega32U4, A0 = PF7 = ADC channel 7 (not channel 0).
; Requires a USB-to-serial adapter on D0(RX)/D1(TX) — see uart example.

[env:leonardo]
platform        = atmelavr
board           = leonardo
upload_protocol = avr109
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega32u4/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega32u4
