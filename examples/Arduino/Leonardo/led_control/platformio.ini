; KTOS — Arduino Leonardo LED control example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   uart_task -> polls USART1 RX every 20 ms, parses ON/OFF/BLINK,
;                posts MSG_SET_MODE to led_task.
;   led_task  -> owns D13 (PC7), switches between OFF / ON / BLINK.
;
; Requires a USB-to-serial adapter on D0(RX)/D1(TX) — see uart example.

[env:leonardo]
platform        = atmelavr
board           = leonardo
upload_protocol = avr109
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega32u4/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega32u4
