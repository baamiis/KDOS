; KTOS — Arduino Leonardo I2C scanner example (bare-metal, no Arduino framework)
;
; Single KTOS task scans the I2C bus (0x01..0x7E) every 5 s.
; SDA = D2 (PD1), SCL = D3 (PD0).  TWI at 100 kHz.  No Wire library.
;
; Requires a USB-to-serial adapter on D0(RX)/D1(TX) — see uart example.
; Note: D0(PD2) is USART1 RX; D1(PD3) is USART1 TX — do not confuse
; with the TWI pins D2(PD1/SDA) and D3(PD0/SCL).

[env:leonardo]
platform        = atmelavr
board           = leonardo
upload_protocol = avr109
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega32u4/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega32u4
