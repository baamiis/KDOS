; KTOS — Arduino Leonardo button control example (bare-metal, no Arduino framework)
;
; Two KTOS tasks:
;   button_task -> polls D4 (PD4) every 5 ms with 30 ms debounce,
;                  posts MSG_BUTTON_EVENT to ui_task on each edge.
;   ui_task     -> sleeps until MSG_BUTTON_EVENT, prints press/release.
;
; D4 (PD4) is used instead of D2 because D2 = PD1 = SDA (I2C) on the 32U4.
; Requires a USB-to-serial adapter on D0(RX)/D1(TX) — see uart example.

[env:leonardo]
platform        = atmelavr
board           = leonardo
upload_protocol = avr109
monitor_speed   = 115200

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/atmega32u4/ktos_bsp.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -I../../../../core
    -I../../../../bsp/atmega32u4
