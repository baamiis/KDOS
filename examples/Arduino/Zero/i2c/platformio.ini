; KTOS — Arduino Zero i2c example (bare-metal, no Arduino framework)
;
; Serial output: connect via the PROGRAMMING port (near RESET button).
; The on-board EDBG chip bridges that port to SERCOM5 (PA22=TX, PA23=RX).

[env:zero]
platform             = atmelsam
board                = zero
upload_protocol      = sam-ba
monitor_speed        = 115200
board_build.ldscript = ../../../../bsp/samd21g18/samd21g18.ld

build_src_filter =
    +<*>
    +<../../../../../core/ktos.c>
    +<../../../../../bsp/samd21g18/ktos_bsp.c>
    +<../../../../../bsp/samd21g18/startup.c>

build_flags =
    -mcpu=cortex-m0plus -mthumb
    -DF_CPU=48000000UL
    -Wall -Wextra -Os
    -ffunction-sections -fdata-sections
    -Wl,--gc-sections
    --specs=nosys.specs
    -I../../../../core
    -I../../../../bsp/samd21g18
